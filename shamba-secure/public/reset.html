<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>Reset your password — Shamba Secure</title>
<link rel="icon" href="/icons/favicon-32.png" sizes="32x32">
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand-row">
      <div class="mark">&#128274;</div>
      <div>
        <h1>Reset your password</h1>
        <div class="tagline">Password resets have moved.</div>
      </div>
    </div>

    <div id="resetInvalid" style="display:block">
      <p class="note">Password resets now happen from the main login screen — use "Forgot your password?" there and enter the code we text or email you.</p>
      <a class="btn" href="/" style="text-decoration:none;display:block;">Go to log in</a>
    </div>
  </div>
</div>

</body>
</html>
